
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <!-- Header -->
        <div class="card-header bg-primary text-white d-flex
                    justify-content-between align-items-center">

            <h4 class="mb-0">Students Management</h4>

            <a th:href="@{/student/add}"
               class="btn btn-light btn-sm">
                + Add Student
            </a>

        </div>

        <div class="card-body">

            <!-- Registration Message -->
            <div th:if="${success != null and !#strings.isEmpty(success)}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <span th:text="${success}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>
            </div>

            <!-- Edit Message -->
            <div th:if="${updateMsg != null and !#strings.isEmpty(updateMsg)}"
                 class="alert alert-info alert-dismissible fade show"
                 role="alert">

                <span th:text="${updateMsg}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>
            </div>

            <!-- Delete Message -->
            <div th:if="${deleteMsg != null and !#strings.isEmpty(deleteMsg)}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <span th:text="${deleteMsg}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close">
                </button>
            </div>

            <!-- Error Message -->
            <div th:if="${error != null and !#strings.isEmpty(error)}"
                 class="alert alert-danger"
                 role="alert">

                <span th:text="${error}"></span>
            </div>

            <!-- Students Table -->
            <div class="table-responsive">

                <table class="table table-bordered table-striped
                              table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>City</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Display Students -->
                    <tr th:each="student : ${students}">

                        <td th:text="${student.studentId}"></td>

                        <td th:text="${student.name}"></td>

                        <td th:text="${student.email}"></td>

                        <td th:text="${student.mobile}"></td>

                        <td th:text="${student.city}"></td>

                        <td class="text-center">

                            <!-- View -->
                            <a th:href="@{/student/view/{id}(id=${student.studentId})}"
                               class="btn btn-info btn-sm text-white">
                                View
                            </a>

                            <!-- Edit -->
                            <a th:href="@{/student/edit/{id}(id=${student.studentId})}"
                               class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <!-- Delete -->
                            <form th:action="@{/student/delete/{id}(id=${student.studentId})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this student?');">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6"
                            class="text-center text-muted">
                            No students found. Click Add Student to
                            create a record.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Total Students -->
            <div class="text-muted">
                Total Students:
                <span th:text="${#lists.size(students)}">0</span>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
