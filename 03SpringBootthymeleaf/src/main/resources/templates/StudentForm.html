
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <!-- Header -->
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Student Details</h4>
        </div>

        <div class="card-body">

            <!-- Error Message -->
            <div th:if="${error != null and !#strings.isEmpty(error)}"
                 class="alert alert-danger"
                 role="alert">

                <span th:text="${error}"></span>
            </div>

            <!-- Student Form -->
            <form th:action="@{${formAction}}"
                  method="post">

                <!-- Name -->
                <div class="mb-3">

                    <label for="name" class="form-label">
                        Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           th:value="${student.name}"
                           required>

                    <!-- Hidden Student ID -->
                    <input type="hidden"
                           name="studentId"
                           th:value="${student.studentId}">
                </div>

                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${student.email}"
                           required>
                </div>

                <!-- Mobile -->
                <div class="mb-3">

                    <label for="mobile" class="form-label">
                        Mobile
                    </label>

                    <input type="text"
                           id="mobile"
                           name="mobile"
                           class="form-control"
                           th:value="${student.mobile}"
                           required>
                </div>

                <!-- City -->
                <div class="mb-3">

                    <label for="city" class="form-label">
                        City
                    </label>

                    <input type="text"
                           id="city"
                           name="city"
                           class="form-control"
                           th:value="${student.city}"
                           required>
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-success">
                    Save Student
                </button>

                <a th:href="@{/student/list}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
