<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Error')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="card border-0 shadow-sm p-5">
                    <div class="text-danger mb-4">
                        <i class="bi bi-exclamation-octagon" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-2" th:text="${errorTitle ?: 'Error'}">Error</h2>
                    <p class="text-muted" th:text="${errorMessage ?: 'Something went wrong.'}"></p>
                    <a th:href="@{/}" class="btn btn-primary mt-3">
                        <i class="bi bi-speedometer2 me-1"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
