<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Customer')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-person-plus me-2"></i>
                            <span th:text="${customer.id != null ? 'Edit Customer' : 'New Customer'}">Customer</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form th:action="@{/customers/save}" method="post" th:object="${customer}" novalidate>
                            <input type="hidden" th:field="*{id}" />
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}"
                                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phone <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{phone}"
                                    th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" />
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Address</label>
                                <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i>Save
                                </button>
                                <a th:href="@{/customers}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
