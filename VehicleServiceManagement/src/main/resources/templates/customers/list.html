<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Customers')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container-fluid py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0"><i class="bi bi-people me-2 text-primary"></i>Customers</h1>
            <a th:href="@{/customers/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>New Customer
            </a>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/customers}" method="get" class="d-flex gap-2">
                    <input type="text" name="search" class="form-control" placeholder="Search by name…"
                        th:value="${search}" />
                    <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
                    <a th:href="@{/customers}" class="btn btn-outline-secondary">Clear</a>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Address</th>
                                <th>Vehicles</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c, stat : ${customers}">
                                <td th:text="${stat.count}"></td>
                                <td class="fw-semibold" th:text="${c.name}"></td>
                                <td th:text="${c.phone}"></td>
                                <td th:text="${c.email ?: '—'}"></td>
                                <td th:text="${c.address ?: '—'}"></td>
                                <td>
                                    <span class="badge bg-primary" th:text="${#lists.size(c.vehicles)}"></span>
                                </td>
                                <td class="text-nowrap">
                                    <a th:href="@{/customers/edit/{id}(id=${c.id})}"
                                        class="btn btn-sm btn-outline-secondary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/customers/delete/{id}(id=${c.id})}" method="post"
                                        class="d-inline" onsubmit="return confirmDelete('customer')">
                                        <button class="btn btn-sm btn-outline-danger"><i
                                                class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="7" class="text-center text-muted py-4">No customers found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
