<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Vehicles')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container-fluid py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0"><i class="bi bi-car-front me-2 text-success"></i>Vehicles</h1>
            <a th:href="@{/vehicles/new}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Register Vehicle</a>
        </div>
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/vehicles}" method="get" class="d-flex gap-2">
                    <input type="text" name="search" class="form-control" placeholder="Search by reg no, make, model…"
                        th:value="${search}" />
                    <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
                    <a th:href="@{/vehicles}" class="btn btn-outline-secondary">Clear</a>
                </form>
            </div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Reg No</th>
                                <th>Make / Model</th>
                                <th>Year</th>
                                <th>Fuel</th>
                                <th>Odometer</th>
                                <th>Customer</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v, stat : ${vehicles}">
                                <td th:text="${stat.count}"></td>
                                <td class="fw-semibold" th:text="${v.registrationNumber}"></td>
                                <td th:text="${v.make + ' ' + v.model}"></td>
                                <td th:text="${v.manufacturingYear}"></td>
                                <td><span class="badge bg-secondary" th:text="${v.fuelType}"></span></td>
                                <td th:text="${v.odometer + ' km'}"></td>
                                <td>
                                    <a th:href="@{/customers/edit/{id}(id=${v.customer.id})}"
                                        class="text-decoration-none" th:text="${v.customer.name}"></a>
                                </td>
                                <td class="text-nowrap">
                                    <a th:href="@{/vehicles/{id}/history(id=${v.id})}"
                                        class="btn btn-sm btn-outline-info me-1" title="History">
                                        <i class="bi bi-clock-history"></i>
                                    </a>
                                    <a th:href="@{/vehicles/edit/{id}(id=${v.id})}"
                                        class="btn btn-sm btn-outline-secondary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/vehicles/delete/{id}(id=${v.id})}" method="post"
                                        class="d-inline" onsubmit="return confirmDelete('vehicle')">
                                        <button class="btn btn-sm btn-outline-danger"><i
                                                class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(vehicles)}">
                                <td colspan="8" class="text-center text-muted py-4">No vehicles found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
