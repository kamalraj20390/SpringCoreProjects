<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' – VSMS'">VSMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- ── Navbar ───────────────────────────────────────────────────── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" th:href="@{/}">
        <i class="bi bi-tools me-2"></i>VSMS
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/customers}"><i class="bi bi-people me-1"></i>Customers</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/vehicles}"><i class="bi bi-car-front me-1"></i>Vehicles</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/bookings}"><i class="bi bi-calendar-check me-1"></i>Bookings</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/job-cards}"><i class="bi bi-clipboard2-check me-1"></i>Job Cards</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/parts}"><i class="bi bi-box-seam me-1"></i>Parts</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/invoices}"><i class="bi bi-receipt me-1"></i>Invoices</a></li>
        </ul>
    </div>
</nav>

<!-- ── Alert Messages ────────────────────────────────────────────── -->
<div th:fragment="alerts" class="container-fluid mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${warning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ── Footer ───────────────────────────────────────────────────── -->
<footer th:fragment="footer" class="text-center text-muted py-3 mt-auto border-top small">
    &copy; 2026 Vehicle Service Management System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
