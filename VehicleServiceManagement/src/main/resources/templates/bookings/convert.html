<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Convert Booking')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-warning py-3">
                        <h4 class="mb-0"><i class="bi bi-arrow-right-circle me-2"></i>Convert to Job Card</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted">
                            Booking for <strong th:text="${booking.vehicle.registrationNumber}"></strong> –
                            <span th:text="${booking.vehicle.make + ' ' + booking.vehicle.model}"></span>
                        </p>
                        <p class="mb-3"><em th:text="${booking.complaint}"></em></p>
                        <form th:action="@{/bookings/{id}/convert(id=${booking.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mechanic Name <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="mechanicName" required />
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Target Completion Date</label>
                                <input type="date" class="form-control" name="targetDate" />
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-warning px-4"><i
                                        class="bi bi-arrow-right-circle me-1"></i>Create Job Card</button>
                                <a th:href="@{/bookings}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
