<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('New Booking')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-info text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-calendar-plus me-2"></i>New Service Booking</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form th:action="@{/bookings/save}" method="post" th:object="${booking}" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Vehicle <span class="text-danger">*</span></label>
                                <select class="form-select" name="vehicle.id" required>
                                    <option value="">-- Select Vehicle --</option>
                                    <option th:each="v : ${vehicles}" th:value="${v.id}"
                                        th:text="${v.registrationNumber + ' – ' + v.make + ' ' + v.model + ' (' + v.customer.name + ')'}">
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Booking Date &amp; Time <span
                                        class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" th:field="*{bookingDate}"
                                    th:classappend="${#fields.hasErrors('bookingDate')} ? 'is-invalid'" />
                                <div class="invalid-feedback" th:errors="*{bookingDate}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Customer Complaint <span
                                        class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{complaint}" rows="3"
                                    th:classappend="${#fields.hasErrors('complaint')} ? 'is-invalid'"></textarea>
                                <div class="invalid-feedback" th:errors="*{complaint}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Requested Service</label>
                                <textarea class="form-control" th:field="*{requestedService}" rows="2"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-info text-white px-4"><i
                                        class="bi bi-save me-1"></i>Save Booking</button>
                                <a th:href="@{/bookings}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
