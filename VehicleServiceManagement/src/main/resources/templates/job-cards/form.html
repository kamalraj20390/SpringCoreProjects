<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('New Job Card')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-warning py-3">
                        <h4 class="mb-0"><i class="bi bi-clipboard2-plus me-2"></i>New Job Card</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/job-cards/save}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Vehicle <span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" name="vehicleId" required>
                                        <option value="">-- Select Vehicle --</option>
                                        <option th:each="v : ${vehicles}" th:value="${v.id}"
                                            th:text="${v.registrationNumber + ' – ' + v.make + ' ' + v.model}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Mechanic Name <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="mechanicName" required />
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Complaint</label>
                                    <textarea class="form-control" name="complaint" rows="2"></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Inspection Notes</label>
                                    <textarea class="form-control" name="inspectionNotes" rows="2"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Target Completion Date</label>
                                    <input type="date" class="form-control" name="targetCompletionDate" />
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-warning px-4"><i class="bi bi-save me-1"></i>Create
                                    Job Card</button>
                                <a th:href="@{/job-cards}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
