<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Job Cards')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <main class="container-fluid py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0"><i class="bi bi-clipboard2-check me-2 text-warning"></i>Job Cards</h1>
            <a th:href="@{/job-cards/new}" class="btn btn-warning"><i class="bi bi-plus-lg me-1"></i>New Job Card</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Job Card No</th>
                                <th>Vehicle</th>
                                <th>Mechanic</th>
                                <th>Status</th>
                                <th>Opened</th>
                                <th>Invoice</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="jc, stat : ${jobCards}">
                                <td th:text="${stat.count}"></td>
                                <td class="fw-semibold" th:text="${jc.jobCardNumber}"></td>
                                <td th:text="${jc.vehicle.registrationNumber + ' – ' + jc.vehicle.make}"></td>
                                <td th:text="${jc.mechanicName}"></td>
                                <td>
									<span class="badge"
									      th:classappend="${jc.status.name() == 'DELIVERED' ? 'bg-success' :
									                       jc.status.name() == 'CANCELLED' ? 'bg-danger' :
									                       jc.status.name() == 'READY_FOR_DELIVERY' ? 'bg-info text-dark' :
									                       'bg-warning text-dark'}"
									      th:text="${jc.status}">
									</span>
                                </td>
                                <td th:text="${#temporals.format(jc.openedAt,'dd MMM yyyy')}"></td>
                                <td>
                                    <span th:if="${jc.invoice != null}" class="badge bg-success"
                                        th:text="${jc.invoice.paymentStatus}"></span>
                                    <span th:if="${jc.invoice == null}" class="text-muted small">—</span>
                                </td>
                                <td>
                                    <a th:href="@{/job-cards/{id}(id=${jc.id})}"
                                        class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-eye me-1"></i>View
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(jobCards)}">
                                <td colspan="8" class="text-center text-muted py-4">No job cards yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
