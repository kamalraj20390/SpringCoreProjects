<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container-fluid py-4 flex-grow-1">
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-speedometer2 fs-3 text-primary me-2"></i>
            <h1 class="h3 mb-0">Dashboard</h1>
        </div>

        <!-- Stat Cards -->
        <div class="row g-4 mb-5">
            <div class="col-sm-6 col-lg-3">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary rounded-circle p-3">
                            <i class="bi bi-people fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${totalCustomers}">0</div>
                            <div class="text-muted small">Total Customers</div>
                        </div>
                    </div>
                    <a th:href="@{/customers}" class="card-footer text-decoration-none small text-primary">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-success bg-opacity-10 text-success rounded-circle p-3">
                            <i class="bi bi-car-front fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${totalVehicles}">0</div>
                            <div class="text-muted small">Total Vehicles</div>
                        </div>
                    </div>
                    <a th:href="@{/vehicles}" class="card-footer text-decoration-none small text-success">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-info bg-opacity-10 text-info rounded-circle p-3">
                            <i class="bi bi-calendar-check fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${todaysBookings}">0</div>
                            <div class="text-muted small">Today's Bookings</div>
                        </div>
                    </div>
                    <a th:href="@{/bookings}" class="card-footer text-decoration-none small text-info">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-warning bg-opacity-10 text-warning rounded-circle p-3">
                            <i class="bi bi-wrench-adjustable fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${vehiclesUnderRepair}">0</div>
                            <div class="text-muted small">Under Repair</div>
                        </div>
                    </div>
                    <a th:href="@{/job-cards}" class="card-footer text-decoration-none small text-warning">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-4">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-success bg-opacity-10 text-success rounded-circle p-3">
                            <i class="bi bi-check2-circle fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${readyForDelivery}">0</div>
                            <div class="text-muted small">Ready for Delivery</div>
                        </div>
                    </div>
                    <a th:href="@{/job-cards}" class="card-footer text-decoration-none small text-success">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-4">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-danger bg-opacity-10 text-danger rounded-circle p-3">
                            <i class="bi bi-receipt fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${unpaidInvoices}">0</div>
                            <div class="text-muted small">Unpaid Invoices</div>
                        </div>
                    </div>
                    <a th:href="@{/invoices}" class="card-footer text-decoration-none small text-danger">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>

            <div class="col-sm-6 col-lg-4">
                <div class="card stat-card border-0 shadow-sm h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon bg-secondary bg-opacity-10 text-secondary rounded-circle p-3">
                            <i class="bi bi-box-seam fs-4"></i>
                        </div>
                        <div>
                            <div class="stat-value fw-bold" th:text="${lowStockParts}">0</div>
                            <div class="text-muted small">Low Stock Parts</div>
                        </div>
                    </div>
                    <a th:href="@{/parts}" class="card-footer text-decoration-none small text-secondary">
                        View all <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Recent Job Cards -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0"><i class="bi bi-clipboard2-check me-2 text-primary"></i>Recent Job Cards</h5>
                <a th:href="@{/job-cards}" class="btn btn-sm btn-outline-primary">View All</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Job Card #</th>
                                <th>Vehicle</th>
                                <th>Mechanic</th>
                                <th>Status</th>
                                <th>Opened</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="jc : ${recentJobCards}">
                                <td th:text="${jc.jobCardNumber}" class="fw-semibold"></td>
                                <td
                                    th:text="${jc.vehicle.registrationNumber + ' – ' + jc.vehicle.make + ' ' + jc.vehicle.model}">
                                </td>
                                <td th:text="${jc.mechanicName}"></td>
                                <td>
                                    <span
                                        th:class="'badge status-' + ${jc.status.name().toLowerCase().replace('_','-')}"
                                        th:text="${jc.status}"></span>
                                </td>
                                <td th:text="${#temporals.format(jc.openedAt, 'dd MMM yyyy')}"></td>
                                <td>
                                    <a th:href="@{/job-cards/{id}(id=${jc.id})}"
                                        class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentJobCards)}">
                                <td colspan="6" class="text-center text-muted py-3">No job cards yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
