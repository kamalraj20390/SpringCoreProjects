
spring.application.name=VehicleServiceManagement

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/vsms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080

# Application
app.low-stock-threshold=5

